#!/bin/bash
################################################################################
# cluster.conf  -- single source of truth for cluster topology.
# Sourced by run-/start-/stop-single-dn-cluster.sh.
################################################################################

# ---- Tapuz HDD cluster (Technion CS) ------------------------------------------
MASTER_NODE="tapuz14"
ALL_NODES=(
    "tapuz14"   # master / NameNode
    "tapuz10"   # worker
    "tapuz11"   # worker
    "tapuz12"   # worker
    "tapuz13"   # worker
)
WORKER_NODES=(
    "tapuz10"
    "tapuz11"
    "tapuz12"
    "tapuz13"
)

# ---- Storage layout -----------------------------------------------------------
# On tapuz nodes /scratch is the local disk (HDD). /home/mostufa.j is NFS-shared
# across all tapuzes, so Hadoop installed there is visible to every node.
STORAGE_BASE="/scratch"
HADOOP_HOME="/home/mostufa.j/hadoop"
IMAGE_DIR="${STORAGE_BASE}/loop_images"
MOUNT_BASE="${STORAGE_BASE}/hdfs_loop"
HADOOP_DATA_DIR="${STORAGE_BASE}/hadoop_data"
TMP_BASE="${STORAGE_BASE}/tmp"
CONFIG_DIR="${TMP_BASE}/hadoop_single_dn_k_dirs"
