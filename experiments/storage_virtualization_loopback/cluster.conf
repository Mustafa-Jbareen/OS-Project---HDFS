#!/bin/bash
################################################################################
# cluster.conf -- selects the cluster definition used by every script here.
#
# Each cluster lives in clusters/<name>.conf (node names, paths). The
# experiment settings are shared by all clusters: experiment.conf.
# Pick a cluster with:
#
#   CLUSTER=tapuz bash run-experiment-loopback-fs.sh
#   CLUSTER=c6620 bash run-experiment-loopback-fs.sh
#
# Without CLUSTER set, it is guessed from the hostname (tapuzNN -> tapuz,
# nodeN / erNNN -> c6620).
################################################################################

_CLUSTER_CONF_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

if [[ -z "${CLUSTER:-}" ]]; then
    case "$(hostname -s 2>/dev/null)" in
        tapuz*)             CLUSTER=tapuz ;;
        node[0-9]*|er[0-9]*) CLUSTER=c6620 ;;
        *)
            echo "cluster.conf: cannot guess the cluster from hostname '$(hostname -s 2>/dev/null)'." >&2
            echo "              Set CLUSTER=tapuz or CLUSTER=c6620." >&2
            return 1 2>/dev/null || exit 1
            ;;
    esac
fi

if [[ ! -f "$_CLUSTER_CONF_DIR/clusters/$CLUSTER.conf" ]]; then
    echo "cluster.conf: unknown CLUSTER='$CLUSTER' (no clusters/$CLUSTER.conf)" >&2
    return 1 2>/dev/null || exit 1
fi

# shellcheck source=/dev/null
source "$_CLUSTER_CONF_DIR/clusters/$CLUSTER.conf"
# shellcheck source=experiment.conf
source "$_CLUSTER_CONF_DIR/experiment.conf"
export CLUSTER
