#!/bin/bash
################################################################################
# cluster.conf  -- single source of truth for cluster topology.
# Sourced by run-/start-/stop-single-dn-cluster.sh.
################################################################################

# ---- c6620 reservation (Utah) -------------------------------------------------
# IMPORTANT: use the *internal* node0..node4 hostnames (10.10.1.x), NOT the
# public er###.utah.cloudlab.us names. Public names resolve to eth0 (the shared
# control network), which CloudLab rate-limits and will *terminate* the
# reservation if exceeded. The 10.10.1.x range is the dedicated experiment
# network. See https://docs.cloudlab.us/control-net.html for details.
#
# Public-name -> internal mapping (kept here for ssh login convenience):
#   er101 -> node0   (master / NameNode)
#   er099 -> node1   (worker)
#   er127 -> node2   (worker)
#   er113 -> node3   (worker)
#   er080 -> node4   (worker)
MASTER_NODE="node0"
ALL_NODES=(
    "node0"   # master / NameNode (er101)
    "node1"   # worker (er099)
    "node2"   # worker (er127)
    "node3"   # worker (er113)
    "node4"   # worker (er080)
)
WORKER_NODES=(
    "node1"
    "node2"
    "node3"
    "node4"
)

# ---- Storage layout -----------------------------------------------------------
# On c6620 the big disk is /mydata (1.4TB LVM on NVMe). bootstrap-c6620.sh
# symlinks /scratch -> /mydata so all the existing /scratch paths work.
STORAGE_BASE="/scratch"
HADOOP_HOME="${STORAGE_BASE}/hadoop/hadoop-3.3.1"
IMAGE_DIR="${STORAGE_BASE}/loop_images"
MOUNT_BASE="${STORAGE_BASE}/hdfs_loop"
HADOOP_DATA_DIR="${STORAGE_BASE}/hadoop_data"
TMP_BASE="${STORAGE_BASE}/tmp"
CONFIG_DIR="${TMP_BASE}/hadoop_single_dn_k_dirs"
