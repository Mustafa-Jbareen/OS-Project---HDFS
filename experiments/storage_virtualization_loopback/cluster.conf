#!/bin/bash
################################################################################
# cluster.conf  -- single source of truth for cluster topology.
# Sourced by run-/start-/stop-single-dn-cluster.sh.
################################################################################

# ---- c6620 reservation (Utah) -------------------------------------------------
MASTER_NODE="er101.utah.cloudlab.us"
ALL_NODES=(
    "er101.utah.cloudlab.us"   # node0 -- master / NameNode
    "er099.utah.cloudlab.us"   # node1 -- worker
    "er127.utah.cloudlab.us"   # node2 -- worker
    "er113.utah.cloudlab.us"   # node3 -- worker
    "er080.utah.cloudlab.us"   # node4 -- worker
)
WORKER_NODES=(
    "er099.utah.cloudlab.us"
    "er127.utah.cloudlab.us"
    "er113.utah.cloudlab.us"
    "er080.utah.cloudlab.us"
)

# ---- Storage layout -----------------------------------------------------------
# On c6620 the big disk is /mydata (1.4TB LVM on NVMe). bootstrap-c6620.sh
# symlinks /scratch -> /mydata so all the existing /scratch paths work.
STORAGE_BASE="/scratch"
HADOOP_HOME="${STORAGE_BASE}/hadoop/hadoop-3.3.1"
IMAGE_DIR="${STORAGE_BASE}/loop_images"
MOUNT_BASE="${STORAGE_BASE}/hdfs_loop"
HADOOP_DATA_DIR="${STORAGE_BASE}/hadoop_data"
TMP_BASE="${STORAGE_BASE}/tmp"
CONFIG_DIR="${TMP_BASE}/hadoop_single_dn_k_dirs"
