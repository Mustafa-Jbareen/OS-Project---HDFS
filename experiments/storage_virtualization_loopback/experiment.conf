#!/bin/bash
################################################################################
# experiment.conf -- experiment settings, the SAME on every cluster.
#
# Sourced by cluster.conf after clusters/<name>.conf (which only holds what
# has to differ: node names and paths). Keeping every measured setting equal
# means a Tapuz run and a CloudLab run differ only in hardware.
#
# Every value can be overridden from the environment, e.g.
#   SLOTS_PER_NODE=52 CONTAINER_MB=1024 bash run-experiment-loopback-fs.sh
# (that pair reproduces the load of c6620 run 2026-05-08_06-37-06).
################################################################################

# YARN pool per node: SLOTS_PER_NODE containers of CONTAINER_MB. 8 x 2 GB is
# the load of the April 2026 Tapuz runs that showed the slowdown (~30 maps at
# once over 4 workers). The pool may exceed physical RAM (7.7 GB on Tapuz):
# a WordCount map uses ~0.5-0.7 GB and memory enforcement is off.
SLOTS_PER_NODE=${SLOTS_PER_NODE:-8}
CONTAINER_MB=${CONTAINER_MB:-2048}

# DataNode heap: every run that showed the slowdown (Tapuz and c6620) used 5500.
DN_HEAP_MB=${DN_HEAP_MB:-5500}

# Disk space for all k loopback images of one node (Tapuz /scratch is 248 GB).
LOOPBACK_BUDGET_PER_NODE_GB=${LOOPBACK_BUDGET_PER_NODE_GB:-200}

# WordCount input: size and HDFS block size.
INPUT_SIZE_GB=${INPUT_SIZE_GB:-8}
BLOCK_SIZE_MB=${BLOCK_SIZE_MB:-32}

# Input size of the 2x2 test: small, so that "warm" can hold it in RAM on
# Tapuz (loopback caches data twice: block file + image).
MATRIX_INPUT_GB=${MATRIX_INPUT_GB:-2}

# Per-job protocol (see run-experiment-loopback-fs.sh): pause after the cache
# step so every job starts from a quiet cluster, and untimed warm-up jobs after
# each cluster start (JIT, jar localization) before the measured jobs.
SETTLE_SECONDS=${SETTLE_SECONDS:-10}
WARMUP_JOBS=${WARMUP_JOBS:-1}
