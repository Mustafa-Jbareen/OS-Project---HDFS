#!/bin/bash
################################################################################
# clusters/c6620.conf -- CloudLab Utah c6620 reservation (NVMe).
# Sourced through ../cluster.conf.
#
# Use the *internal* node0..node4 hostnames (10.10.1.x), NOT the public
# er###.utah.cloudlab.us names. Public names resolve to the shared control
# network, which CloudLab rate-limits and will terminate the reservation if
# exceeded. See https://docs.cloudlab.us/control-net.html.
#
# Public-name -> internal mapping of the May 2026 reservation (expired; update
# for a new one, for ssh login convenience only):
#   er101 -> node0 (master)   er099 -> node1   er127 -> node2
#   er113 -> node3            er080 -> node4
################################################################################

MASTER_NODE="node0"
ALL_NODES=(
    "node0"   # master / NameNode + ResourceManager
    "node1"   # worker
    "node2"   # worker
    "node3"   # worker
    "node4"   # worker
)
WORKER_NODES=(
    "node1"
    "node2"
    "node3"
    "node4"
)

# ---- Storage layout -----------------------------------------------------------
# On c6620 the big disk is /mydata (LVM on NVMe). bootstrap-c6620.sh symlinks
# /scratch -> /mydata so all the /scratch paths work.
STORAGE_BASE="/scratch"
HADOOP_HOME="${STORAGE_BASE}/hadoop/hadoop-3.3.6"   # same version as tapuz; installed by bootstrap-c6620.sh
IMAGE_DIR="${STORAGE_BASE}/loop_images"
MOUNT_BASE="${STORAGE_BASE}/hdfs_loop"
HADOOP_DATA_DIR="${STORAGE_BASE}/hadoop_data"
TMP_BASE="${STORAGE_BASE}/tmp"
CONFIG_DIR="${TMP_BASE}/hadoop_single_dn_k_dirs"

# Experiment settings (YARN pool, heap, input, ...) are shared by all clusters:
# see ../experiment.conf. To reproduce the load of c6620 run
# 2026-05-08_06-37-06 (~52 maps at once per node) set
# SLOTS_PER_NODE=52 CONTAINER_MB=1024.

# Housekeeping only (not measured): the base install's configs reference the
# hostnames of an old reservation, so restoring the "normal" cluster after a
# run does not work here.
RESTORE_BASE_CLUSTER=${RESTORE_BASE_CLUSTER:-0}
