#!/bin/bash
################################################################################
# clusters/tapuz.conf -- Tapuz HDD cluster (Technion CS).
# Sourced through ../cluster.conf. Nodes: 4 cores, 7.7 GB RAM, one HDD each.
################################################################################

MASTER_NODE="tapuz14"
ALL_NODES=(
    "tapuz14"   # master / NameNode + ResourceManager
    "tapuz10"   # worker
    "tapuz11"   # worker
    "tapuz12"   # worker
    "tapuz13"   # worker
)
WORKER_NODES=(
    "tapuz10"
    "tapuz11"
    "tapuz12"
    "tapuz13"
)

# ---- Storage layout -----------------------------------------------------------
# On tapuz nodes /scratch is the local disk (HDD). /home/mostufa.j is NFS-shared
# across all tapuzes, so the Hadoop install there is visible to every node.
STORAGE_BASE="/scratch"
HADOOP_HOME="/home/mostufa.j/hadoop"
IMAGE_DIR="${STORAGE_BASE}/loop_images"
MOUNT_BASE="${STORAGE_BASE}/hdfs_loop"
HADOOP_DATA_DIR="${STORAGE_BASE}/hadoop_data"
TMP_BASE="${STORAGE_BASE}/tmp"
CONFIG_DIR="${TMP_BASE}/hadoop_single_dn_k_dirs"

# Experiment settings (YARN pool, heap, input, ...) are shared by all clusters:
# see ../experiment.conf.

# Housekeeping only (not measured): re-format and start the normal
# (non-experiment) cluster when a run ends.
RESTORE_BASE_CLUSTER=${RESTORE_BASE_CLUSTER:-1}
