#!/bin/bash
################################################################################
# clusters/tapuz.conf -- Tapuz HDD cluster (Technion CS).
# Sourced through ../cluster.conf. Nodes: 4 cores, 7.7 GB RAM, one HDD each.
################################################################################

MASTER_NODE="tapuz14"
ALL_NODES=(
    "tapuz14"   # master / NameNode + ResourceManager
    "tapuz10"   # worker
    "tapuz11"   # worker
    "tapuz12"   # worker
    "tapuz13"   # worker
)
WORKER_NODES=(
    "tapuz10"
    "tapuz11"
    "tapuz12"
    "tapuz13"
)

# ---- Storage layout -----------------------------------------------------------
# On tapuz nodes /scratch is the local disk (HDD). /home/mostufa.j is NFS-shared
# across all tapuzes, so the Hadoop install there is visible to every node.
STORAGE_BASE="/scratch"
HADOOP_HOME="/home/mostufa.j/hadoop"
IMAGE_DIR="${STORAGE_BASE}/loop_images"
MOUNT_BASE="${STORAGE_BASE}/hdfs_loop"
HADOOP_DATA_DIR="${STORAGE_BASE}/hadoop_data"
TMP_BASE="${STORAGE_BASE}/tmp"
CONFIG_DIR="${TMP_BASE}/hadoop_single_dn_k_dirs"

# ---- Experiment defaults (each can be overridden from the environment) --------
# YARN load: 8 containers of 2 GB per worker. This is what the April 2026 runs
# (the ones that showed the ~13% slowdown at k=1024) actually ran with -- their
# job counters show ~29 map tasks running at once over the 4 workers, 2048 MB
# each. The May 9 run that showed no slowdown had only ~1 per node.
SLOTS_PER_NODE=${SLOTS_PER_NODE:-8}
CONTAINER_MB=${CONTAINER_MB:-2048}
DN_HEAP_MB=${DN_HEAP_MB:-5500}                      # all runs through May 8 used 5500
LOOPBACK_BUDGET_PER_NODE_GB=${LOOPBACK_BUDGET_PER_NODE_GB:-200}   # /scratch is ~248 GB
# Input for the 2x2 test: small, so that warm runs can keep the data in RAM
# (loopback caches it twice: once in the HDFS block files, once in the image).
MATRIX_INPUT_GB=${MATRIX_INPUT_GB:-2}
# Re-format and start the normal (non-experiment) cluster when a run ends.
RESTORE_BASE_CLUSTER=${RESTORE_BASE_CLUSTER:-1}
